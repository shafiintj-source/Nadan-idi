name: Build Naadan Adi Android Test APK

on:
  push:
    branches:
      - test-apk-2026-11-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export Godot Android debug APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          presets_to_export: Android
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Verify APK exists
        run: |
          test -s build/NaadanAdi-Test.apk
          ls -lh build/NaadanAdi-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NaadanAdi-Test-APK
          path: build/NaadanAdi-Test.apk
          if-no-files-found: error
          retention-days: 14
