name: Build Naadan Adi Android Test APK

on:
  push:
    branches:
      - test-apk-2026-11-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -o "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          sudo install -m 0755 "$RUNNER_TEMP/godot/bin/Godot_v4.4.1-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -o -j "$RUNNER_TEMP/godot/templates.tpz" -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          godot --version

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -x "$JAVA_HOME/bin/java"
          java -version

      - name: Import Godot project
        run: godot --headless --editor --path . --import --quit

      - name: Export Android debug APK
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/NaadanAdi-Test.apk --verbose
          test -s build/NaadanAdi-Test.apk
          ls -lh build/NaadanAdi-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NaadanAdi-Test-APK
          path: build/NaadanAdi-Test.apk
          if-no-files-found: error
          retention-days: 14
